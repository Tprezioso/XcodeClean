name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild \
            -scheme XcodeClean \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        run: |
          APP_PATH=$(find build -name "XcodeClean.app" -type d | head -1)
          ditto "$APP_PATH" "XcodeClean.app"
          ditto -c -k --keepParent "XcodeClean.app" "XcodeClean.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: XcodeClean.zip
          generate_release_notes: true
          draft: false
          prerelease: false
